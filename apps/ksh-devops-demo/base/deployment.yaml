apiVersion: apps/v1
kind: Deployment

metadata:
  name: ksh-devops-demo

  labels:
    app.kubernetes.io/name: ksh-devops-demo
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: ksh-devops-project

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: ksh-devops-demo

  template:
    metadata:
      labels:
        app.kubernetes.io/name: ksh-devops-demo
        app.kubernetes.io/component: application
        app.kubernetes.io/part-of: ksh-devops-project

    spec:
      terminationGracePeriodSeconds: 30

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: ksh-devops-demo

          image: ksh-devops-demo:placeholder

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /readyz
              port: http

            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /healthz
              port: http

            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /healthz
              port: http

            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 200m
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532

            capabilities:
              drop:
                - ALL